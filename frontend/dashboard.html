<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Inkwell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="masthead">
    <div class="wrap">
      <a href="index.html" class="brand">Ink<span>well</span></a>
      <button class="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html" data-nav="guest">Login</a>
        <a href="register.html" data-nav="guest" class="btn">Start Writing</a>
        <a href="dashboard.html" class="active" data-nav="user">Dashboard</a>
        <a href="create-blog.html" data-nav="user">Create Blog</a>
        <a href="profile.html" data-nav="user">Profile</a>
        <a href="#" data-nav="user" data-action="logout">Logout</a>
      </nav>
    </div>
    <div class="masthead-rule"></div>
  </header>

  <main class="wrap">
    <div class="dash-header">
      <div>
        <p class="eyebrow">Your desk</p>
        <h1 id="dash-greeting">Welcome back</h1>
      </div>
      <a href="create-blog.html" class="btn">+ Create Blog</a>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="num" id="stat-count">0</div>
        <div class="label">Published posts</div>
      </div>
      <div class="stat-card">
        <div class="num" id="dash-username">—</div>
        <div class="label">Signed in as</div>
      </div>
    </div>

    <div class="section-heading">
      <h2>Your posts</h2>
    </div>

    <div class="dash-list" id="my-blogs"></div>
  </main>

  <footer class="wrap">
    <span>© 2026 Inkwell. Built as a learning project.</span>
    <span>Home · Login · Register · Dashboard · Create Blog</span>
  </footer>

  <script src="js/app.js"></script>
  <script>
    // Fill the "signed in as" stat from the saved session.
    document.addEventListener("DOMContentLoaded", () => {
      const session = getSession();
      const el = document.querySelector("#dash-username");
      if (session && el) el.textContent = session.name.split(" ")[0];
    });
  </script>
</body>
</html>
