<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Inkwell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="masthead">
    <div class="wrap">
      <a href="index.html" class="brand">Ink<span>well</span></a>
      <button class="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html" data-nav="guest">Login</a>
        <a href="register.html" data-nav="guest" class="btn">Start Writing</a>
        <a href="dashboard.html" data-nav="user">Dashboard</a>
        <a href="create-blog.html" data-nav="user">Create Blog</a>
        <a href="profile.html" class="active" data-nav="user">Profile</a>
        <a href="#" data-nav="user" data-action="logout">Logout</a>
      </nav>
    </div>
    <div class="masthead-rule"></div>
  </header>

  <main class="wrap">
    <div class="auth-page" style="min-height: auto; padding: 60px 24px;">
      <div class="auth-card">
        <p class="eyebrow">Account</p>
        <h1>Your profile</h1>

        <div class="profile-row">
          <span class="profile-label">Name</span>
          <span class="profile-value" id="profile-name">—</span>
        </div>
        <div class="profile-row">
          <span class="profile-label">Email</span>
          <span class="profile-value" id="profile-email">—</span>
        </div>
        <div class="profile-row">
          <span class="profile-label">Member since</span>
          <span class="profile-value" id="profile-since">—</span>
        </div>

        <button class="btn btn-block btn-danger" id="profile-logout-btn" style="margin-top: 24px;">Log Out</button>
      </div>
    </div>
  </main>

  <footer class="wrap">
    <span>© 2026 Inkwell. Built as a learning project.</span>
    <span>Home · Login · Register · Dashboard · Create Blog · Profile</span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
