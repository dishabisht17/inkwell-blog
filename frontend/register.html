<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Inkwell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="masthead">
    <div class="wrap">
      <a href="index.html" class="brand">Ink<span>well</span></a>
      <button class="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html" data-nav="guest">Login</a>
        <a href="register.html" class="active btn" data-nav="guest">Start Writing</a>
        <a href="dashboard.html" data-nav="user">Dashboard</a>
        <a href="create-blog.html" data-nav="user">Create Blog</a>
        <a href="profile.html" data-nav="user">Profile</a>
        <a href="#" data-nav="user" data-action="logout">Logout</a>
      </nav>
    </div>
    <div class="masthead-rule"></div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <p class="eyebrow">Join Inkwell</p>
      <h1>Create your account</h1>

      <div class="form-msg"></div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Jordan Rivera" required />
          <div class="field-error"></div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
          <div class="field-error"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" required />
          <div class="field-error"></div>
        </div>

        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" name="confirm" placeholder="Retype your password" required />
          <div class="field-error"></div>
        </div>

        <button type="submit" class="btn btn-block">Create Account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>

  <footer class="wrap">
    <span>© 2026 Inkwell. Built as a learning project.</span>
    <span>Home · Login · Register · Dashboard · Create Blog</span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
